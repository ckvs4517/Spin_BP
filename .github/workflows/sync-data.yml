name: Sync Beyblade data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-data.mjs'
      - '.github/workflows/sync-data.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync catalog data and images
        run: npm run sync:data
      - name: Commit updated snapshot only when catalog changed
        run: |
          if [ -z "$(git status --porcelain -- data/beyblades.json images)" ]; then
            git checkout -- data/meta.json
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data images
          git commit -m "chore: sync Beyblade catalog"
          git push
